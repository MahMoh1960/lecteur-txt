plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'ma.lecteurtxt'
    compileSdk 34

    defaultConfig {
        applicationId 'ma.lecteurtxt'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Clé fixe : les mises à jour successives s'installent par-dessus l'ancienne version.
    signingConfigs {
        debug {
            storeFile file('cle.jks')
            storePassword 'lecteurtxt'
            keyAlias 'lecteur'
            keyPassword 'lecteurtxt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
